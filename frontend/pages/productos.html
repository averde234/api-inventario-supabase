<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/maindesigne.css">
</head>
<body>
<div class="d-flex" id="wrapper">

  <!-- Barra lateral -->
  <div class="bg-white" id="sidebar-wrapper">
    <div class="sidebar-heading text-center py-4 primary-text fs-4 fw-bold text-uppercase border-botton">
      <i class="fas fa-solid fa-shop me-2"></i> SUPERMARKET
    </div>
    <div class="list-group list-group-flush my-3">
      <a href="../frontend/dashboard.index.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-project-diagram me-2"></i> Dashboard
      </a>
      <a href="./pages/productos.html" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-solid fa-list-ul me-2"></i> Productos
      </a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-solid fa-cart-plus me-2"></i> Compras
      </a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-solid fa-cart-shopping me-2"></i> Ventas
      </a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-solid fa-boxes-stacked me-2"></i> Inventario
      </a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-solid fa-user me-2"></i> Usuarios
      </a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent second-text fw-bold">
        <i class="fas fa-solid fa-truck-moving me-2"></i> Proveedores
      </a>
      <a href="#" class="list-group-item list-group-item-action bg-transparent text-danger fw-bold">
        <i class="fas fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesion
      </a>
    </div>
  </div>
  <!-- Fin barra lateral -->

  <!-- Contenido principal -->
  <div id="page-content-wrapper">
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4 px-4">
      <div class="d-flex align-items-center">
        <i class="fas fa-align-left primary-text fs-4 me-3" id="menu-toggle"></i>
        <h2 class="fs-2 m-0">Productos</h2>
      </div>
    </nav>
    <section class="card">

      <div class="container-fluid px-1 py-3">
        <div class="bg-white rounded shadow-sm overflow-hidden">
          
          <!-- 🔎 Buscador -->
          <form id="filtros-form" class="row g-2 p-3">
            <div class="col-md-6">
              <input type="text" id="search-input" class="form-control" placeholder="Buscar por descripción o código de barra">
            </div>
            <div class="col-md-4">
              <select id="categoria-select" class="form-select">
                <option value="">Todas las categorías</option>
                <!-- Opciones dinámicas desde JS -->
              </select>
            </div>
            <div class="col-md-2 d-grid">
              <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
          </form>
          
          <!-- Tabla -->
          <div class="row" id="table-head">
            <div class="col-12">
              <div class="card">
                <div class="card-header">
                  <h4 class="card-title">Listado de productos</h4>
                </div>
                <div class="card-content">
                  <div class="card-body">
                  </div>
                  <div class="table-responsive">
                    <table class="table mb-0">
                      <thead class="thead-dark">
                        <tr>
                          <th>ID</th>
                          <th>Código de Barra</th>
                          <th>Descripción</th>
                          <th>Categoría</th>
                          <th>Acciones</th>
                        </tr>
                      </thead>
                      <tbody>
                        <!-- Filas dinámicas desde productos.js -->
      
                          <td>
                            <a href="#" onclick="editarProducto(5)" class="btn btn-warning round me-2">
                              <i class="fas fa-edit me-1"></i> Editar
                            </a>
                            <a href="#" onclick="borrarProducto(1)" class="btn btn-danger round">
                              <i class="fas fa-trash-alt me-1"></i> Borrar
                            </a>
                          </td>
                          
                          
                        </tr>
                        <!-- Más filas generadas por JS -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          
          
          <!-- Paginación -->
          <div id="pagination" class="mt-3 d-flex justify-content-center"></div>
        </div>
      </div>
    </section>
    </div>
  </div>
  
<!-- Modal de confirmación para borrar -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        ¿Seguro que quieres eliminar este producto?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal para editar producto -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form id="editForm" class="modal-content">
      <div class="modal-header bg-warning">
        <h5 class="modal-title">Editar producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label class="form-label">Código de barra</label>
          <input type="text" id="editCodigo" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <input type="text" id="editDescripcion" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <!-- Ahora es un select con nombres -->
          <select id="editCategoria" class="form-select" required>
            <!-- Opciones dinámicas desde JS -->
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-warning">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts -->
<script src="../conexionfrontedbackend/productos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
