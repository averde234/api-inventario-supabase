                <section class="containerForm">
  <div class="container mt-4">

    <!-- FILA 1 -->
    <div class="row g-3">

      <!-- CÓDIGO DE BARRA -->
      <div class="col-md-4">
        <label class="form-label">Código de Barra</label>
        <div class="input-icon">
          <input type="text" class="form-control input-lupa" id="codigoBarra">
          <button type="button" id="buscarCodigo" class="btn-lupa">🔍</button>
        </div>
      </div>

      <!-- PRODUCTO -->
      <div class="col-md-4">
        <label class="form-label">Producto</label>
        <input type="text" class="form-control" id="producto">
      </div>

      <!-- PROVEEDOR -->
      <div class="col-md-4">
        <label class="form-label">Proveedor</label>
        <select class="form-select" id="proveedor">
          <option selected>Seleccione proveedor</option>
        </select>
      </div>

      <!-- CANTIDAD -->
      <div class="col-md-4">
        <label class="form-label">Cantidad</label>
        <input type="number" class="form-control" id="cantidad">
      </div>

      <!-- PORCENTAJE GANANCIA -->
      <div class="col-md-4">
        <label class="form-label">Porcentaje ganancia (%)</label>
        <input type="number" class="form-control" id="porcentajeGanancia">
      </div>

    </div>

    <!-- SECCIÓN PRECIOS -->
    <div class="row mt-2">

      <!-- COLUMNA BS -->
      <div class="col-md-6">
        <h5 class="mt-3">Precios en Bs</h5>

        <label class="form-label">Precio entrada Bs</label>
        <input type="number" class="form-control" id="precioEntradaBs">

        <label class="form-label mt-2">Precio salida Bs</label>
        <input type="number" class="form-control" id="precioSalidaBs">

        <label class="form-label mt-2">Margen de ganancia Bs</label>
        <input type="number" class="form-control" id="margenGananciaBs">

        <label class="form-label mt-2">Precio por unidad Bs</label>
        <input type="number" class="form-control" id="precioUnidadBs">
      </div>

      <!-- COLUMNA USD -->
      <div class="col-md-6">
        <h5 class="mt-3">Precios en $</h5>

        <label class="form-label">Precio entrada $</label>
        <input type="number" class="form-control" id="precioEntradaUsd">

        <label class="form-label mt-2">Precio salida $</label>
        <input type="number" class="form-control" id="precioSalidaUsd">

        <label class="form-label mt-2">Margen de ganancia $</label>
        <input type="number" class="form-control" id="margenGananciaUsd">

        <label class="form-label mt-2">Precio por unidad $</label>
        <input type="number" class="form-control" id="precioUnidadUsd">
      </div>

    </div>

    <!-- BOTONES -->
    <div class="mt-4">
      <button class="btn btn-success me-2" id="guardarInventario">Guardar</button>
      <button class="btn btn-secondary" id="limpiar">Limpiar</button>
    </div>

  </div>
</section>


<!-- Modal para registrar producto -->
<div class="modal fade" id="registroProductoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form id="formRegistroProducto" class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Registrar nuevo producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Código de barra</label>
          <input type="text" id="nuevoCodigo" class="form-control" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <input type="text" id="nuevoDescripcion" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select id="nuevoCategoria" class="form-select" required>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
