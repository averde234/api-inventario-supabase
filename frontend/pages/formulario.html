<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/form.css">
    <title>Compras</title>
</head>
<body>

<div class="container mt-4">

    <!-- FILA 1 -->
    <div class="row g-3">

        <!-- CÓDIGO DE BARRA -->
        <div class="col-md-4">
            <label class="form-label">Código de Barra</label>
            <div class="input-icon">
                <input type="text" class="form-control input-lupa" id="codigoBarra">
                <button type="button" id="buscarCodigo" class="btn-lupa">🔍</button>
            </div>
        </div>

        <!-- PROVEEDOR -->
        <div class="col-md-4">
            <label class="form-label">Proveedor</label>
            <select class="form-select" id="proveedor">
                <option selected>Seleccione proveedor</option>
                <option>Proveedor 1</option>
                <option>Proveedor 2</option>
            </select>
        </div>

        <!-- PRODUCTO -->
        <div class="col-md-4">
            <label class="form-label">Producto</label>
            <input type="text" class="form-control" id="producto">
        </div>

        <!-- CANTIDAD -->
        <div class="col-md-4">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" id="cantidad">
        </div>

        <!-- PORCENTAJE -->
        <div class="col-md-4">
            <label class="form-label">Porcentaje ganancia</label>
            <input type="number" class="form-control" id="ganancia">
        </div>

        <!-- FACTURA -->
        <div class="col-md-4">
            <label class="form-label">Factura</label>
            <input type="text" class="form-control" id="factura">
        </div>

        <!-- IVA -->
        <div class="col-md-4">
            <label class="form-label d-block">IVA</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="iva" value="si">
                <label class="form-check-label">Sí</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="iva" value="no">
                <label class="form-check-label">No</label>
            </div>
        </div>

    </div>

    <!-- SECCIÓN PRECIOS -->
    <div class="row mt-2">

        <!-- COLUMNA BS -->
        <div class="col-md-6">
            <h5 class="mt-3">Precios en Bs</h5>

            <label class="form-label">Precio entrada Bs</label>
            <input type="number" class="form-control" id="precioEntradaBs">

            <label class="form-label mt-2">Precio IVA Bs</label>
            <input type="number" class="form-control" id="precioIVABs">

            <label class="form-label mt-2">Precio salida Bs</label>
            <input type="number" class="form-control" id="precioSalidaBs">

            <label class="form-label mt-2">Precio por unidad Bs</label>
            <input type="number" class="form-control" id="precioUnidadBs">
        </div>

        <!-- COLUMNA USD -->
        <div class="col-md-6">
            <h5 class="mt-3">Precios en $</h5>

            <label class="form-label">Precio salida $</label>
            <input type="number" class="form-control" id="precioSalidaUsd">

            <label class="form-label mt-2">Precio IVA $</label>
            <input type="number" class="form-control" id="precioIVAUsd">

            <label class="form-label mt-2">Precio salida $</label>
            <input type="number" class="form-control" id="precioSalidaUsd2">

            <label class="form-label mt-2">Precio por unidad $</label>
            <input type="number" class="form-control" id="precioUnidadUsd">
        </div>

    </div>

    <!-- BOTONES -->
    <div class="mt-4">
        <button class="btn btn-success me-2">Guardar</button>
        <button class="btn btn-secondary" id="limpiar">Limpiar</button>
    </div>

</div>

</body>
</html>
